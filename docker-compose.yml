# Docker Compose для запуска Kotaemon в контейнере.
#
# Использование:
#   1. Скопировать .env.example в .env и задать ключи API.
#   2. Сборка и запуск:
#      docker compose build
#      docker compose up -d
#   3. После запуска: http://localhost:7860
#
# Обновление без полной пересборки (исходники монтируются):
#   ./scripts/docker-update.sh
#
# Образ включает все инструменты: MS GraphRAG, Nano GraphRAG, LightRAG, Unstructured, Docling.
#
# GPU: по умолчанию включён (cu121). Требуется NVIDIA Container Toolkit.
# Для CPU-only: задайте TORCH_DEVICE=cpu в .env и закомментируйте deploy ниже.
#
# База данных: PostgreSQL обязателен. DATABASE_URL задаётся в .env или используется дефолт для Docker Compose.
# Раскомментируйте depends_on: postgres и переменную DATABASE_URL ниже.

x-common-env: &common-env
  GRADIO_SERVER_NAME: "0.0.0.0"
  GRADIO_SERVER_PORT: "7860"

x-common-volumes: &common-volumes
  - ktem_app_data:/app/ktem_app_data
  # Монтирование исходников: быстрые обновления (git pull + restart) и отладка
  - .:/app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_DEVICE: ${TORCH_DEVICE:-cu121}
    image: kotaemon:latest
    container_name: kotaemon
    ports:
      - "${KOTAEMON_PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      <<: *common-env
      THEFLOW_SETTINGS_MODULE: flowsettings
      QDRANT_URL: http://qdrant:6333
      SEARXNG_URL: http://searxng:8080
      # Без логина: прямой доступ к Chat/Files (admin/admin при KH_FEATURE_USER_MANAGEMENT=true)
      KH_FEATURE_USER_MANAGEMENT: "false"
      # PostgreSQL: обязателен, раскомментировать для использования сервиса postgres
      DATABASE_URL: postgresql://kotaemon:${POSTGRES_PASSWORD:-kotaemon}@postgres:5432/kotaemon
    depends_on:
      qdrant:
        condition: service_started
      searxng:
        condition: service_started
      postgres:
        condition: service_started
      db_init:
        condition: service_completed_successfully
    volumes: *common-volumes
    restart: unless-stopped
    # GPU: по умолчанию включён. Для CPU-only закомментируйте.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:7860')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  searxng:
    image: searxng/searxng:latest
    container_name: kotaemon-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kotaemon-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # PostgreSQL с pgvector (опционально): раскомментировать depends_on в app и DATABASE_URL в environment
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    container_name: kotaemon-postgres
    environment:
      POSTGRES_USER: kotaemon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kotaemon}
      POSTGRES_DB: kotaemon
    # Оптимизация производительности: параметры через command (для продакшена)
    # Для тонкой настройки создайте postgresql.conf и смонтируйте в /var/lib/postgresql/data/postgresql.conf
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -q"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 60s

  # Создание БД kotaemon при отсутствии (официальный postgres:16 — Debian)
  db_init:
    image: postgres:16
    platform: linux/amd64
    container_name: kotaemon-db-init
    environment:
      PGHOST: postgres
      PGUSER: kotaemon
      PGPASSWORD: ${POSTGRES_PASSWORD:-kotaemon}
    volumes:
      - ./docker/postgres/init-ensure-db.sh:/init-ensure-db.sh:ro
    entrypoint: ["/bin/sh", "/init-ensure-db.sh"]
    depends_on:
      postgres:
        condition: service_started
    restart: "no"

  # Ollama для локальных моделей: docker compose --profile ollama up -d
  # В .env задать KH_OLLAMA_URL=http://ollama:11434/v1/
  ollama:
    image: ollama/ollama:latest
    container_name: kotaemon-ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ktem_app_data:
    name: kotaemon_ktem_app_data
  qdrant_data:
    name: kotaemon_qdrant_data
  postgres_data:
    name: kotaemon_postgres_data
  ollama_models:
    name: kotaemon_ollama_models
