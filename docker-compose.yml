# Docker Compose для запуска Kotaemon в контейнере.
#
# Использование:
#   1. Скопировать .env.example в .env и задать ключи API.
#   2. Сборка и запуск:
#      docker compose up -d --build
#   3. Вариант образа (lite | full | ollama):
#      KOTAEMON_IMAGE=full docker compose up -d --build
#   4. После запуска: http://localhost:7860
#
# Образы:
#   lite   — минимальный (по умолчанию).
#   full   — GraphRAG, Unstructured, Docling, тяжёлые зависимости.
#   ollama — full + встроенный Ollama для локальных моделей.

x-common-env: &common-env
  GRADIO_SERVER_NAME: "0.0.0.0"
  GRADIO_SERVER_PORT: "7860"

x-common-volumes: &common-volumes
  - ktem_app_data:/app/ktem_app_data

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${KOTAEMON_IMAGE:-lite}
    image: kotaemon:${KOTAEMON_IMAGE:-lite}
    container_name: kotaemon
    ports:
      - "${KOTAEMON_PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      <<: *common-env
    volumes:
      <<: *common-volumes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Ollama для локальных моделей: docker compose --profile ollama up -d
  # В .env задать KH_OLLAMA_URL=http://ollama:11434/v1/
  ollama:
    image: ollama/ollama:latest
    container_name: kotaemon-ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ktem_app_data:
    name: kotaemon_ktem_app_data
  ollama_models:
    name: kotaemon_ollama_models
