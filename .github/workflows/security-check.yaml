name: security-check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  dependency-audit:
    name: dependency audit with pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U --upgrade-strategy eager -e "libs/kotaemon[all]"
          pip install -U --upgrade-strategy eager -e "libs/ktem"
          pip install pip-audit

      - name: Run dependency audit (fail on unresolved vulnerabilities)
        run: |
          pip-audit
