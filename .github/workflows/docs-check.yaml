name: docs-check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  mkdocs-build:
    name: Build docs with mkdocs --strict
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone the repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r doc_env_reqs.txt

      - name: Build docs
        run: |
          mkdocs build --strict
