# build backend and build dependencies
[build-system]
requires = ["setuptools >= 61.0", "wheel", "setuptools-git-versioning>=2.0,<3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages.find.include = ["kotaemon*"]
packages.find.exclude = ["tests*", "env*"]

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}"
dirty_template = "{tag}"
tag_filter = "v?\\d+(\\.\\d+)*.*"

# metadata and dependencies
[project]
name = "kotaemon"
dynamic = ["version"]
requires-python = ">= 3.10"
description = "Kotaemon core library for AI development."
dependencies = [
    "azure-ai-documentintelligence",
    "selectolax>=0.3.0",
    "click>=8.1.7,<9",
    "cohere>=5.3.2,<6",
    "cookiecutter>=2.6.0,<3",
    "fast_langdetect",
    "fastapi>=0.115.0,<0.120",
    "gradio>=5.0.0,<6",
    "huggingface-hub<1.0",
    "html2text>=2024.2.26",
    "langchain>=0.3.0,<0.4",
    "langchain-community>=0.3.0,<0.4",
    "langchain-openai>=0.2.0,<0.4",
    "langchain-google-genai>=2.0.0,<3.0",
    "langchain-anthropic>=0.3.0,<0.4",
    "langchain-ollama>=0.3.0,<1.0",
    "langchain-mistralai>=0.2.0,<1.0",
    "langchain-cohere>=0.3.0,<0.4",
    "langgraph>=0.2.0",
    "llama-index>=0.12.0,<0.15",
    "chromadb>=0.5.0",
    "llama-index-vector-stores-chroma>=0.4.0",
    "llama-index-vector-stores-lancedb>=0.3.0",
    "llama-index-vector-stores-qdrant>=0.9.0",
    "qdrant-client>=1.16.0",
    "fastembed>=0.3.0",
    "openai>=2.0.0,<3",
    "matplotlib>=3.8.0",
    "matplotlib-inline>=0.1.6",
    "openpyxl>=3.1.2,<3.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0", # https://github.com/chroma-core/chroma/issues/2571
    "pandas>=2.2.2,<2.3",
    "plotly>=5.18.0,<6.0.0",
    "PyMuPDF>=1.23.0,<=1.24.11",
    "pypdf>=5.1.0,<7",
    "pylance",
    "pydantic-settings>=2.0.0",
    "python-docx>=1.1.0,<1.2",
    "python-dotenv>=1.0.1,<1.1",
    "tenacity>=8.2.3,<9",
    "theflow>=0.8.6,<0.9.0",
    "trogon>=0.5.0,<0.6",
    "umap-learn>=0.5.5,<0.6",
    "tavily-python>=0.4.0",
    "pydantic>=2.0.0,<=2.10.6",
]
readme = "README.md"
authors = [
    { name = "@trducng", email = "john@cinnamon.is" },
    { name = "@lone17", email = "ian@cinnamon.is" },
    { name = "@taprosoft", email = "tadashi@cinnamon.is" },
    { name = "@cin-albert", email = "albert@cinnamon.is" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
adv = [
    "duckduckgo-search>=6.1.0,<7",
    "elasticsearch>=8.13.0,<9",
    "onnxruntime>=1.18.0,<2",
    "googlesearch-python>=1.2.4,<1.3",
    "llama-cpp-python>=0.2.0,<0.2.8",
    "llama-index>=0.12.0,<0.15",
    "pymilvus[milvus-lite]>=2.6.7,<3",
    "llama-index-vector-stores-milvus>=1.0.0",
    "sentence-transformers>=2.2.0",
    "tabulate>=0.9.0",
    "unstructured>=0.15.8,<0.19",
    "wikipedia>=1.4.0,<1.5",
    "voyageai>=0.3.0",
]
dev = [
    "coverage>=7.0.0",
    "ipython>=8.0.0",
    "mypy>=1.13.0",
    "pre-commit>=3.0.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.8.0",
    "sphinx>=7.0.0",
]
test = [
    "ddgs>=9.0.0",
    "duckduckgo-search>=6.1.0,<7",
    "haystack-ai>=2.0.0,<3",
    "pymilvus[milvus-lite]>=2.6.7,<3",
    "llama-index-vector-stores-milvus>=1.0.0",
    "pdfminer.six",
    "sentence-transformers>=2.2.0",
    "unstructured[pdf]>=0.15.8,<0.19",
]
all = ["kotaemon[adv,dev,test]"]

[project.scripts]
kotaemon = "kotaemon.cli:main"
