# CPU-only вариант: отключает GPU.
# Использование: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
# Сборка: TORCH_DEVICE=cpu docker compose -f docker-compose.yml -f docker-compose.cpu.yml build --ssh default

services:
  app:
    build:
      args:
        TORCH_DEVICE: cpu
    deploy: {}
